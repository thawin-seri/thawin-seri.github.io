# Pages CMS (https://pagescms.org) — edit the site from a web dashboard.
media:
  input: src/assets/photos
  output: ../../assets/photos
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, dateText, featured]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary (1–2 sentences)
        type: text
        required: true
      - name: dateText
        label: Date shown
        description: e.g. "Summer 2026" or "Fall 2026 – present"
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: tags
        label: Tools & topics
        type: string
        list: true
      - name: image
        label: Image
        type: image
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: href
            label: URL
            type: string
      - name: order
        label: Order (lower = first)
        type: number
      - name: featured
        label: Show on home page
        type: boolean
        default: true
      - name: draft
        label: Hide (draft)
        type: boolean
        default: false
      - name: body
        label: Write-up
        type: rich-text

  - name: photos
    label: Photos
    type: collection
    path: src/content/objects
    format: yaml-frontmatter
    filename: "{primary}.mdx"
    view:
      fields: [title, dateText, featured]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Photo
        type: image
        required: true
      - name: caption
        label: Place
        description: Groups photos within an album, e.g. "Bangkok" or "Italy"
        type: string
        required: true
      - name: dateText
        label: Date shown
        description: Optional, e.g. "March 2026"
        type: string
      - name: year
        label: Year (for sorting)
        type: number
      - name: medium
        label: Film / camera
        type: string
        required: true
      - name: collection
        label: Album
        type: select
        default: asia
        options:
          values: [asia, north-america, europe]
      - name: credit
        label: Credit
        type: string
      - name: span
        label: Width in grid (1 = normal, 2 = wide)
        type: number
        default: 1
        options:
          min: 1
          max: 2
      - name: featured
        label: Show on home page
        type: boolean
        default: false
      - name: draft
        label: Hide (draft)
        type: boolean
        default: false
      - name: body
        label: Story (optional)
        type: rich-text

  - name: albums
    label: Albums
    type: collection
    path: src/content/collections
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: title
        label: Album name
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: order
        label: Order
        type: number
      - name: cover
        label: Cover photo
        type: image

  - name: about
    label: About page
    type: file
    path: src/data/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: About text
        type: rich-text
      - name: facts
        label: Facts list
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: value
            type: string
